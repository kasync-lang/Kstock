# -----------------------------------------------------------------------------
# CI cho Kstock monorepo.
#
# Mỗi folder là một service sẽ được container hoá riêng. Workflow này:
#   1. Phát hiện folder nào bị thay đổi (path filter).
#   2. Chỉ chạy TEST + BUILD (Docker image) cho ĐÚNG (những) folder đó.
#      Folder không đổi sẽ KHÔNG tạo runner, KHÔNG build, KHÔNG test.
#
# Thêm một service mới: thêm 1 filter trong job `changes` và 1 dòng trong
# COMPONENTS (bước "Build matrix of changed components"). Không cần sửa gì khác.
# -----------------------------------------------------------------------------
name: CI - Test & Build

on:
  push:
    branches: [main, test-ci]
  pull_request:
    branches: [main]

# Huỷ các lần chạy cũ khi có commit mới trên cùng nhánh.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter cần quyền đọc danh sách file thay đổi của PR.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Bước 1: xác định folder nào thay đổi -> dựng matrix CHỈ gồm các folder đó.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed folders
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
      has_changes: ${{ steps.components.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            interactionapp:
              - 'backend/core-api/**'
            streamstock:
              - 'backend/stream-gateway/**'
            authenapp:
              - 'backend/auth-service/**'
            newsingester:
              - 'data/ingestion/news-ingester/**'
            newsprocesing:
              - 'data/processing/news-processing/**'
            airflow:
              - 'data/orchestration/airflow/**'
            frontend:
              - 'frontend/**'
            aggregate:
              - 'data/processing/ohlcv-aggregator/**'
            recorddata:
              - 'data/ingestion/tick-recorder/**'
            collectdata:
              - 'data/ingestion/market-collector/**'
            nginx:
              - 'platform/nginx/**'
            infrastructure:
              - 'platform/infrastructure/**'
            ci:
              - '.github/workflows/ci.yml'

      - name: Build matrix of changed components
        id: components
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          # key -> (job name, folder, language, test command)
          # language: go | python | node | terraform | none
          COMPONENTS = {
              "interactionapp": ("interactionapp", "backend/core-api", "go", "go test ./..."),
              "streamstock": ("streamstock", "backend/stream-gateway", "go", "go test ./..."),
              "authenapp": ("authenapp", "backend/auth-service", "python", "uv run python -m pytest -q"),
              "newsingester": ("newsingester", "data/ingestion/news-ingester", "python", "uv run python -m unittest discover -s tests -v"),
              "newsprocesing": ("newsprocesing", "data/processing/news-processing", "python", "uv run python -m unittest discover -p 'test_*.py' -v"),
              "airflow": ("airflow", "data/orchestration/airflow", "none", "python3 -m compileall -q dags"),
              "frontend": ("frontend", "frontend/kstockFE", "node", "npm ci && npm run build"),
              "aggregate": ("aggregate", "data/processing/ohlcv-aggregator", "python", "uv run python -m unittest discover -s tests -v"),
              "recorddata": ("recorddata", "data/ingestion/tick-recorder", "python", "uv run python -m pytest -q"),
              "collectdata": ("collectdata", "data/ingestion/market-collector", "python", ""),
              "nginx": ("nginx", "platform/nginx", "none", "docker compose -f docker-compose.yaml config -q"),
              "infrastructure": ("infrastructure", "platform/infrastructure", "terraform", "terraform fmt -check -recursive"),
          }

          changed = json.loads(os.environ.get("FILTER_OUTPUTS") or "{}")
          # Thay đổi chính file CI -> chạy lại toàn bộ để kiểm chứng workflow.
          run_all = changed.get("ci") == "true"

          include = []
          for key, (name, directory, lang, test) in COMPONENTS.items():
              if not (run_all or changed.get(key) == "true"):
                  continue
              include.append({
                  "name": name,
                  "dir": directory,
                  "lang": lang,
                  "test": test,
                  # Chỉ build image nếu folder đã có Dockerfile.
                  "dockerfile": "true" if pathlib.Path(directory, "Dockerfile").is_file() else "false",
              })

          has_changes = bool(include)
          # Nếu không có gì đổi vẫn trả về 1 entry noop để matrix không rỗng;
          # job test-build sẽ bị chặn bởi `if: has_changes == 'true'`.
          matrix = {"include": include or [{"name": "noop", "dir": ".", "lang": "none", "test": "", "dockerfile": "false"}]}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              fh.write("has_changes=" + ("true" if has_changes else "false") + "\n")

          print("Changed components:", [item["name"] for item in include] or "none")
          PY

  # ---------------------------------------------------------------------------
  # Bước 2: với MỖI folder đã thay đổi -> test + build image của chính nó.
  # ---------------------------------------------------------------------------
  test-build:
    name: ${{ matrix.name }} · test & build
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    # Biến môi trường tối thiểu để test đọc config không fail vì thiếu env.
    env:
      S3_BUCKET: kstock-test
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      QDRANT_URL: http://localhost:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- Toolchain theo ngôn ngữ (chỉ cái khớp mới chạy) -----
      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Set up uv
        if: matrix.lang == 'python'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Set up Terraform
        if: matrix.lang == 'terraform'
        uses: hashicorp/setup-terraform@v3

      # ----- TEST -----
      - name: Run tests
        if: matrix.test != ''
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.test }}

      # ----- BUILD (container hoá) -----
      - name: Set up Docker Buildx
        if: matrix.dockerfile == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: matrix.dockerfile == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          tags: kstock-${{ matrix.name }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        if: matrix.dockerfile == 'true'
        run: docker images | grep "kstock-${{ matrix.name }}"
