# Tên workflow hiển thị trên GitHub Actions
name: CI - Test & Build

# Kích hoạt workflow khi:
on:
  push:
    branches: [ main, test-ci ]  # Chạy khi push code lên nhánh main hoặc develop
  pull_request:
    branches: [ main ]           # Chạy khi tạo PR vào nhánh main

jobs:
  # Job 1: Chạy unit test và kiểm tra code
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    
    # Chỉ định thư mục làm việc mặc định cho các step bên dưới
    defaults:
      run:
        working-directory: ./InteractionApp

    steps:
      # Bước 1: Checkout source code từ repository về runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Go phiên bản 1.25 (khớp với go.mod)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Cache dependencies để tăng tốc độ build lần sau
          cache-dependency-path: InteractionApp/go.sum

      # Bước 3: Tải các thư viện Go cần thiết (go mod download)
      - name: Download dependencies
        run: go mod download

      # Bước 4: Kiểm tra code style (tùy chọn nhưng nên có)
#      - name: Run linter
#        run: |
#          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.3.1
#          golangci-lint run ./...

      # Bước 5: Chạy toàn bộ unit test trong project
      # -v: hiển thị chi tiết từng test case
      # ./...: chạy test trong tất cả các package
      - name: Run tests
        run: go test -v ./...

  # Job 2: Build Docker image (chạy sau khi test thành công)
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # Chỉ chạy khi job test pass
    
    steps:
      # Bước 1: Checkout code để lấy Dockerfile và source
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Docker Buildx (hỗ trợ build multi-platform và cache tốt hơn)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Build Docker image
      # - context: thư mục chứa Dockerfile (./InteractionApp)
      # - tags: đặt tên image với tag là commit SHA để dễ trace
      # - load: true để image xuất hiện trong docker images local (dùng cho test)
      # - cache-from/to: sử dụng GitHub Actions cache để tăng tốc build lần sau
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./InteractionApp
          tags: kstock-interaction:${{ github.sha }}
          load: true  # Load image vào docker daemon local (không push lên registry)
          cache-from: type=gha  # Lấy cache từ GitHub Actions
          cache-to: type=gha,mode=max  # Lưu cache cho lần build sau

      # Bước 4: Kiểm tra image đã build thành công chưa
      - name: Verify image
        run: |
          docker images | grep kstock-interaction
          echo "Image built successfully: kstock-interaction:${{ github.sha }}"