# Google OAuth callback: param scope chứa URL googleapis.com/auth/userinfo.profile
# bị rule 930120 (LFI, ".profile") chặn oan -> gỡ target ARGS:scope khỏi rule này
SecRule REQUEST_URI "@beginsWith /auth/google/callback" \
    "id:1000,phase:1,pass,nolog,ctl:ruleRemoveTargetById=930120;ARGS:scope"
SecAction "id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_COOKIES:g_state"

