services:
  interact_app:
    image: postgres:13-alpine
    container_name: db_interact
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=interactdb
    ports:
      - 5432:5432
    volumes:
      - postges_interact_data:/var/lib/postgresql/data
volumes:
  postges_interact_data:
