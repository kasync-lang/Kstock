<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Xin chào</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    }
    .card {
      background: #fff;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(0,0,0,0.12);
    }
    h1 {
      margin-top: 0;
      color: #1976d2;
      font-size: 2rem;
    }
    p {
      color: #555;
      font-size: 1.1rem;
    }
    button {
      margin-top: 1.5rem;
      background-color: #1976d2;
      color: white;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      background-color: #1565c0;
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Xin chào 👋</h1>
    <p>Chào mừng bạn đến ứng dụng của chúng tôi.</p>
    <button onclick="window.location.href='/signup'">Đến trang Login</button>
  </div>
</body>
</html>
