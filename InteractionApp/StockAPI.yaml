openapi: 3.0.3
info:
  title: Stock Symbol Service API
  version: 1.0.0
  description: API cho quản lý symbol yêu thích, ghi chú và cảnh báo người dùng.

servers:
  - url: https://api.mydomain.com
    description: Production server
  - url: http://localhost:8080
    description: Local server

security:
  - BearerAuth: []

tags:
  - name: favorite
    description: api for favorite with user
  - name: notes
    description: manipulation with notes
  - name: alert
    description : seting allert
  - name: symbol
    description: filter symbol


paths:
  /favorites:
    get:
      tags:
        - favorite
      summary: Get user's favorite symbols list
      responses:
        "200":
          description: Danh sách symbol yêu thích
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
    post:
      tags:
        - favorite
      summary: Add symbol to favorite list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Symbol được thêm thành công
  /favorites/{id}:
    delete:
      tags:
        - favorite
      summary: Remove symbol from favorite list
      description: Remove favorite of symbol of user
      parameters:
        - name: symbolID
          required: true
          schema:
            type: string
          in: query
          description: symbol that needs to be deleted
      responses:
        '204':
          description: Delete successfully
        '404':
          description: Not found favorite symbol
        '403':
          description: Forbidden



  /notes:
    get:
      tags:
        - notes
      summary: Get user's notes list
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Danh sách ghi chú
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: string
                description: User not found
    post:
      tags:
        - notes
      summary: Create new note for user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Ghi chú được tạo thành công
        "404":
          description: UserID or symbol is Invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string



  /notes/{id}:
    get:
      tags:
        - notes
      summary: Get detail note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chi tiết ghi chú
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: Invalid request parameter
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — user not allowed to access this note
        "404":
          description: Note not found
    put:
      tags:
        - notes
      summary: Update note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        "200":
          description: Update note successful
        "400":
          description: Invalid request parameter
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — user not allowed to access this note
        "404":
          description: Note not found
    delete:
      tags:
        - notes
      summary: Delete note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Delete Successful
        "400":
          description: Invalid request parameter
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — user not allowed to access this note
        "404":
          description: Not found

  /alerts:
    get:
      tags:
        - alert
      summary: Get full trigger alert of user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert list of user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      tags:
        - alert
      summary: Create new alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "201":
          description: Alert được tạo thành công

  /alerts/{id}:
    put:
      tags:
        - alert
      summary: Update alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                trigger:
                  type: string
      responses:
        "200":
          description: Alert updated successfully
        "400":
            description: Invalid request parameter
        "401":
            description: Unauthorized
    delete:
      tags:
        - alert
      summary: Remove alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Xóa thành công
        "400":
            description: Invalid request parameter
        "401":
            description: Unauthorized
        "403":
            description: Forbidden — user not allowed to access this alert

  /symbols:
    get:
      tags:
        - symbol
      summary: Query symbol list with filter
      parameters:
        - name: name
          required: False
          in: query
          schema:
            type: string
        - name: exchange
          in: query
          schema:
            type: string
        - name : order_by
          in: query
          schema:
            type: string
            enum: [name, marketCapitalization, ipo]
      responses:
        "200":
          description: Danh sách symbol
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymbolDetail"

  /symbols/{symbol}:
    get:
      tags:
        - symbol
      summary: Lấy thông tin chi tiết symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thông tin symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolDetail"
  /assets:
    get:
      tags:
        - asset
      summary: Get all assets
      responses:
        "200":
          description: Danh sách tất cả assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token xác thực JWT phát hành bởi authentication server khác (auth.mydomain.com).
        Service này chỉ kiểm tra và xác minh chữ ký JWT (RS256).

  schemas:
    Favorite:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        symbol:
          type: string
    Asset:
      type: object
      properties:
        symbol:
          type: string
        amount:
          type: number
        unitPrice:
          type: number
    FavoriteInput:
      type: object
      required: [ symbol]
      properties:
        symbol:
          type: string

    Note:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        symbol:
          type: string
        title:
          type: string
        content:
          type: string

    NoteInput:
      type: object
      required: [ symbol, title]
      properties:
        symbol:
          type: string
        title:
          type: string
        content:
          type: string

    Alert:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        symbol:
          type: string
        trigger:
          description: Trigger condition for alert
          allOf:
            - $ref: '#/components/schemas/AlertCondition'



    AlertInput:
      type: object
      required: [userId, symbol, trigger]
      properties:
        symbol:
          type: string
        trigger:
          type: string

    AlertCondition:
      type: object
      properties:
        operator:
          type: string
          enum: [and, or]
          description: Logical operator combining subconditions.
        conditions:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/SimpleCondition'
              - $ref: '#/components/schemas/AlertCondition'  # recursive reference

    SimpleCondition:
      type: object
      properties:
        name:
          type: string
          description: Metric or field name (e.g. price, volume)
        operator:
          type: string
          enum: ['>', '<', '>=', '<=', '==', '!=']
        threshold:
          type: number
          description: Numeric threshold value.
        time:
          type: string
          format: date-time
          nullable: true
          description: Optional time-based trigger.
      required: [name, operator]
    SymbolDetail:
      type: object
      properties:
        country:
          type: string
        currency:
          type: string
        exchange:
          type: string
        ipo:
          type: string
        marketCapitalization:
          type: integer
        name:
          type: string
        phone:
          type: string
        shareOutstanding:
          type: number
        ticker:
          type: string
        weburl:
          type: string
        logo:
          type: string
        Industry:
          type: string
